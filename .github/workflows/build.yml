name: Engine SDK candidates

on:
  workflow_dispatch:
    inputs:
      skip_macos:
        description: Diagnostic run for Linux, Windows and Android only
        type: boolean
        default: false
      diagnostic_groups:
        description: Optional comma-separated matrix groups; skipped jobs do not count as validation
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: mac-arm64
            runner: macos-26
            targets: macos-arm64,ios-device-arm64,ios-simulator-arm64
          - group: mac-x64
            runner: macos-26-intel
            targets: macos-x64,ios-simulator-x64
          - group: windows-x64
            runner: windows-2025
            targets: windows-x64
          - group: windows-arm64
            runner: windows-11-arm
            targets: windows-arm64
          - group: android
            runner: ubuntu-24.04
            targets: android-arm32,android-arm64,android-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Select Apple build tools
        if: startsWith(matrix.group, 'mac-') && !inputs.skip_macos
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          brew install cmake ninja
      - name: Install Android build tools
        if: matrix.group == 'android' && (inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.group))
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build patchelf binutils
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;30.0.16248370'
          set -o pipefail
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Check Windows build tools
        if: startsWith(matrix.group, 'windows-')
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools are missing' }
      - run: dart pub get
      - name: Build and check target SDKs
        if: runner.os != 'Windows' && (!inputs.skip_macos || !startsWith(matrix.group, 'mac-')) && (inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.group))
        env:
          FLAX_BUILD_JOBS: ${{ matrix.group == 'mac-arm64' && '2' || '4' }}
        run: dart run tool/ci_build.dart --targets=${{ matrix.targets }}
      - name: Build and check Windows SDKs
        if: runner.os == 'Windows' && (inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.group))
        env:
          FLAX_BUILD_JOBS: '4'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $arch = if ('${{ matrix.group }}' -eq 'windows-arm64') { 'arm64' } else { 'amd64' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $sdk = '10.0.26100.0'
          $sdkHeaders = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Include\$sdk\um"
          if (-not (Test-Path $sdkHeaders)) { throw "Windows SDK $sdk is missing" }
          cmd /c "`"$dev`" -arch=$arch -winsdk=$sdk && dart run tool/ci_build.dart --targets=${{ matrix.targets }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !inputs.skip_macos && contains(matrix.targets, 'macos-arm64')
        with:
          name: sdk-macos-arm64
          path: |
            dist/*-macos-arm64.tar.gz
            dist/SHA256SUMS-macos-arm64.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !inputs.skip_macos && contains(matrix.targets, 'macos-x64')
        with:
          name: sdk-macos-x64
          path: |
            dist/*-macos-x64.tar.gz
            dist/SHA256SUMS-macos-x64.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !inputs.skip_macos && contains(matrix.targets, 'ios-device-arm64')
        with:
          name: sdk-ios-device-arm64
          path: |
            dist/*-ios-device-arm64.tar.gz
            dist/SHA256SUMS-ios-device-arm64.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !inputs.skip_macos && contains(matrix.targets, 'ios-simulator-arm64')
        with:
          name: sdk-ios-simulator-arm64
          path: |
            dist/*-ios-simulator-arm64.tar.gz
            dist/SHA256SUMS-ios-simulator-arm64.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !inputs.skip_macos && contains(matrix.targets, 'ios-simulator-x64')
        with:
          name: sdk-ios-simulator-x64
          path: |
            dist/*-ios-simulator-x64.tar.gz
            dist/SHA256SUMS-ios-simulator-x64.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && contains(matrix.targets, 'windows-x64')
        with:
          name: sdk-windows-x64
          path: |
            dist/*-windows-x64.tar.gz
            dist/SHA256SUMS-windows-x64.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && contains(matrix.targets, 'windows-arm64')
        with:
          name: sdk-windows-arm64
          path: |
            dist/*-windows-arm64.tar.gz
            dist/SHA256SUMS-windows-arm64.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && contains(matrix.targets, 'android-arm32')
        with:
          name: sdk-android-arm32
          path: |
            dist/*-android-arm32.tar.gz
            dist/SHA256SUMS-android-arm32.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && contains(matrix.targets, 'android-arm64')
        with:
          name: sdk-android-arm64
          path: |
            dist/*-android-arm64.tar.gz
            dist/SHA256SUMS-android-arm64.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && contains(matrix.targets, 'android-x64')
        with:
          name: sdk-android-x64
          path: |
            dist/*-android-x64.tar.gz
            dist/SHA256SUMS-android-x64.txt
          if-no-files-found: warn
          retention-days: 14

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    timeout-minutes: 360
    steps:
      - name: Install baseline tools
        if: inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.target)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates unzip python3 python3-pip ninja-build patchelf binutils clang build-essential xz-utils pkg-config libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          curl --fail --location --retry 2 --output /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          echo 'deb https://apt.llvm.org/focal/ llvm-toolchain-focal-23 main' > /etc/apt/sources.list.d/llvm.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang-23
          curl --fail --location --retry 2 --output /tmp/git-2.50.1.tar.xz https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.50.1.tar.xz
          echo '7e3e6c36decbd8f1eedd14d42db6674be03671c2204864befa2a41756c5c8fc4  /tmp/git-2.50.1.tar.xz' | sha256sum -c -
          tar -xf /tmp/git-2.50.1.tar.xz -C /tmp
          make -C /tmp/git-2.50.1 -j2 prefix=/usr/local NO_GETTEXT=YesPlease NO_TCLTK=YesPlease
          make -C /tmp/git-2.50.1 prefix=/usr/local NO_GETTEXT=YesPlease NO_TCLTK=YesPlease install
          test "$(git --version)" = 'git version 2.50.1'
          python3 -m pip install 'cmake>=3.24,<5'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.target)
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        if: inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.target)
        with:
          sdk: 3.13.2
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.target)
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - if: inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.target)
        run: node --version
      - if: inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.target)
        run: dart pub get
      - if: inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.target)
        env:
          FLAX_BUILD_JOBS: '4'
        run: dart run tool/ci_build.dart --targets=${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, matrix.target))
        with:
          name: sdk-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}.tar.gz
            dist/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: warn
          retention-days: 14

  linux-arm64-consumer:
    needs: linux
    if: needs.linux.result == 'success' && (inputs.diagnostic_groups == '' || contains(inputs.diagnostic_groups, 'linux-arm64'))
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Install consumer build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates unzip python3 python3-pip ninja-build patchelf binutils build-essential xz-utils
          curl --fail --location --retry 2 --output /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          echo 'deb https://apt.llvm.org/focal/ llvm-toolchain-focal-23 main' > /etc/apt/sources.list.d/llvm.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang-23
          python3 -m pip install 'cmake>=3.24,<5'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
          architecture: arm64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - run: node --version
      - run: dart pub get
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-linux-arm64
          path: dist
      - name: Execute relocated SDK consumers
        run: |
          for ENGINE in hermes v8; do
            mkdir -p "build/consumer/$ENGINE"
            tar -xzf "dist/flax-engine-sdk-0.3.0-$ENGINE-linux-arm64.tar.gz" -C "build/consumer/$ENGINE"
            dart run tool/check_sdk.dart "$ENGINE" "build/consumer/$ENGINE"
          done
