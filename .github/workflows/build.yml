name: Engine builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engines/**'
      - 'tool/**'
      - 'runtime.json'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'engines/**'
      - 'tool/**'
      - 'runtime.json'
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        engine: [hermes, v8]
    runs-on: ${{ matrix.engine == 'v8' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Select pinned V8 host tools
        if: matrix.engine == 'v8'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - run: brew install cmake ninja
      - run: dart pub get
      - run: dart run tool/build.dart --engine=${{ matrix.engine }}
      - run: dart run tool/package.dart --engine=${{ matrix.engine }}
      - name: Verify packaged artifact
        run: |
          dart run tool/check_sdk.dart ${{ matrix.engine }} build/sdk/${{ matrix.engine }}-macos-arm64
          VERSION=$(jq -r .runtimeVersion runtime.json)
          test -s "dist/flax-engine-sdk-$VERSION-${{ matrix.engine }}-macos-arm64.tar.gz"
          tar -tzf "dist/flax-engine-sdk-$VERSION-${{ matrix.engine }}-macos-arm64.tar.gz" | grep -q './manifest.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-${{ matrix.engine }}
          path: dist/*.tar.gz
          retention-days: 7
