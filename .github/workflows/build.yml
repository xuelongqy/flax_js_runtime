name: Engine builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'abi/**'
      - 'engines/**'
      - 'tool/build.dart'
      - 'tool/package.dart'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'abi/**'
      - 'engines/**'
      - 'tool/build.dart'
      - 'tool/package.dart'
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        engine: [hermes, v8]
    runs-on: ${{ matrix.engine == 'v8' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Select pinned V8 host tools
        if: matrix.engine == 'v8'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - run: brew install cmake ninja
      - run: dart pub get
      - run: dart run tool/build.dart --engine=${{ matrix.engine }}
      - run: dart run tool/package.dart --engine=${{ matrix.engine }}
      - name: Verify packaged artifact
        run: |
          test -s "dist/flax-js-runtime-0.1.0-${{ matrix.engine }}-macos-arm64.tar.gz"
          tar -tzf "dist/flax-js-runtime-0.1.0-${{ matrix.engine }}-macos-arm64.tar.gz" | grep -q './manifest.json'
