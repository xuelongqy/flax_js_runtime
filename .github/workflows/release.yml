name: Publish engine SDK
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Engine builds workflow run containing both SDKs
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: brew install cmake ninja
      - run: dart pub get
      - name: Verify tag and candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          test "${{ github.ref_type }}" = tag
          test "${{ github.ref_name }}" = "v$(jq -r .runtimeVersion runtime.json)"
          test "$(gh run view "$CANDIDATE_RUN" --json headSha --jq .headSha)" = "$GITHUB_SHA"
          test "$(gh run view "$CANDIDATE_RUN" --json conclusion --jq .conclusion)" = success
          mkdir -p dist
          gh run download "$CANDIDATE_RUN" --pattern 'sdk-*' --dir dist
          find dist -name '*.tar.gz' -exec mv {} dist/ \;
      - name: Verify exact candidate archives
        run: |
          VERSION=$(jq -r .runtimeVersion runtime.json)
          for ENGINE in hermes v8; do
            ARCHIVE="dist/flax-engine-sdk-$VERSION-$ENGINE-macos-arm64.tar.gz"
            test -s "$ARCHIVE"
            mkdir -p "build/release/$ENGINE"
            tar -xzf "$ARCHIVE" -C "build/release/$ENGINE"
            dart run tool/check_sdk.dart "$ENGINE" "build/release/$ENGINE"
          done
          shasum -a 256 dist/*.tar.gz > dist/SHA256SUMS.txt
      - name: Publish verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS.txt --verify-tag --title "$GITHUB_REF_NAME"
