name: Runtime release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime version to publish (for example 0.1.0)
        required: true
        default: 0.1.0
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        engine: [hermes, v8]
    runs-on: ${{ matrix.engine == 'v8' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Select pinned V8 host tools
        if: matrix.engine == 'v8'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - run: brew install cmake ninja
      - run: dart pub get
      - run: dart run tool/build.dart --engine=${{ matrix.engine }}
      - run: dart run tool/package.dart --engine=${{ matrix.engine }}
      - name: Validate release version
        run: |
          VERSION="${RELEASE_VERSION#v}"
          test "$VERSION" = "0.1.0"
          test -s "dist/flax-js-runtime-$VERSION-${{ matrix.engine }}-macos-arm64.tar.gz"
      - name: Preserve release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.engine }}
          path: dist/*.tar.gz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: runtime-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '0.1.0' }}
          target_commitish: ${{ github.sha }}
          files: dist/*.tar.gz
