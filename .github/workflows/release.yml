name: Publish engine SDK
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Engine SDK candidates run containing all 24 archives
        required: true
      platform_validation_completed:
        description: Confirm all 24 candidates passed target execution and Flax validation
        type: boolean
        required: true
        default: false
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: brew install cmake ninja
      - run: dart pub get
      - name: Verify tag and candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          test "${{ github.ref_type }}" = tag
          test "${{ github.ref_name }}" = "v$(jq -r .runtimeVersion runtime.json)"
          test "${{ inputs.platform_validation_completed }}" = true
          test "$(gh run view "$CANDIDATE_RUN" --json name --jq .name)" = 'Engine SDK candidates'
          test "$(gh run view "$CANDIDATE_RUN" --json headSha --jq .headSha)" = "$GITHUB_SHA"
          test "$(gh run view "$CANDIDATE_RUN" --json conclusion --jq .conclusion)" = success
          mkdir -p dist
          gh run download "$CANDIDATE_RUN" --pattern 'sdk-*' --dir dist
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
      - name: Verify all candidate archives
        run: |
          VERSION=$(jq -r .runtimeVersion runtime.json)
          TARGETS='macos-arm64 macos-x64 linux-x64 linux-arm64 windows-x64 windows-arm64 android-arm32 android-arm64 android-x64 ios-device-arm64 ios-simulator-arm64 ios-simulator-x64'
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = 24
          test "$(find dist -maxdepth 1 -name 'SHA256SUMS-*.txt' | wc -l | tr -d ' ')" = 12
          (cd dist && for CHECKSUM in SHA256SUMS-*.txt; do shasum -a 256 -c "$CHECKSUM"; done)
          for ENGINE in hermes v8; do
            for TARGET in $TARGETS; do
              ARCHIVE="dist/flax-engine-sdk-$VERSION-$ENGINE-$TARGET.tar.gz"
              test -s "$ARCHIVE"
              DIRECTORY="build/release/$ENGINE-$TARGET"
              mkdir -p "$DIRECTORY"
              python3 - "$ARCHIVE" "$DIRECTORY" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], 'r:gz') as archive:
              for member in archive:
                  name = pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or '..' in name.parts or not (member.isfile() or member.isdir()):
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              archive.extractall(sys.argv[2], filter='data')
          PY
              dart run tool/check_archive.dart "$ENGINE" "$TARGET" "$DIRECTORY"
            done
          done
          shasum -a 256 dist/*.tar.gz > dist/SHA256SUMS.txt
      - name: Publish verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS.txt --verify-tag --title "$GITHUB_REF_NAME"
